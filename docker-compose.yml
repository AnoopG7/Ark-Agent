name: ark-agent

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ark}
      POSTGRES_DB: ${POSTGRES_DB:-ark}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ark}:${POSTGRES_PASSWORD:-ark}@db:5432/${POSTGRES_DB:-ark}
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      # Re-use the locally downloaded embedding model (bge-small, ~65 MB) instead of fetching it again.
      - ./backend/.fastembed_cache:/app/.fastembed_cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
