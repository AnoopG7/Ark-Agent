[project]
name = "ark-agent"
version = "0.1.0"
description = "ReAct flood-relief planning agent for the Driftwood Bay Coordination Centre"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires the Postgres service from docker compose"]
addopts = "-m 'not integration'"
